<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Edge LLM Chat</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10a37f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <!-- Markdown & Syntax Highlighting libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>New Chat</span>
                </button>
            </div>

            <div class="model-select-box">
                <label for="modelSelect">Target LLM Model:</label>
                <select id="modelSelect">
                    <option value="codegemma:2b">💡 CodeGemma 2B (Coding)</option>
                    <option value="deepseek-r1:1.5b" selected>🧠 DeepSeek R1 1.5B (Reasoning)</option>
                    <option value="llama3.2:1b">⚡ Llama 3.2 1B (Ultra Edge)</option>
                    <option value="qwen2.5:1.5b">🌐 Qwen 2.5 1.5B (General)</option>
                </select>
            </div>

            <div class="chat-history-list" id="chatHistoryList">
                <!-- Dynamically populated -->
            </div>

            <div class="sidebar-footer">
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot offline"></span>
                    <span class="status-text">Checking PC connection...</span>
                </div>
                <button class="settings-btn" id="settingsBtn">⚙️ System Prompt</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-chat">
            <header class="top-header">
                <button class="mobile-toggle-btn" id="mobileToggleBtn">☰</button>
                <div class="header-title">
                    <span class="lock-icon">🔒</span>
                    <span class="title-text">Private Local Chat</span>
                    <span class="model-badge" id="currentModelBadge">DeepSeek R1 1.5B</span>
                </div>
                <div class="header-actions">
                    <button class="download-model-btn" id="pullModelBtn" title="Pull missing models to PC">📥 Pull Models</button>
                    <button class="download-model-btn kill-btn" id="killEngineBtn" title="Unload models from RAM/VRAM & stop generation">⛔ Reset LLM</button>
                </div>
            </header>

            <!-- Chat Message Feed -->
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-icon">⚡</div>
                    <h2>Private Edge AI Chat</h2>
                    <p>Powered by local GGUF edge models running directly on your hardware. 100% private & zero data tracking.</p>
                    
                    <div class="suggestion-grid">
                        <button class="suggestion-card" onclick="usePrompt('Write a Python function for binary search with comments')">
                            <strong>👨‍💻 Coding (CodeGemma)</strong>
                            <span>"Write a Python function for binary search with comments"</span>
                        </button>
                        <button class="suggestion-card" onclick="usePrompt('Explain step-by-step how transformer attention mechanisms work')">
                            <strong>🧠 Reasoning (DeepSeek)</strong>
                            <span>"Explain step-by-step how transformer attention mechanisms work"</span>
                        </button>
                        <button class="suggestion-card" onclick="usePrompt('Summarize key principles for designing clean API contracts')">
                            <strong>📝 General Task</strong>
                            <span>"Summarize key principles for designing clean API contracts"</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <form id="chatForm" onsubmit="return false;">
                    <div class="input-box-wrapper">
                        <textarea id="promptInput" placeholder="Send a message... (Shift+Enter for new line)" rows="1"></textarea>
                        <button type="submit" id="sendBtn" class="send-btn" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </form>
                <div class="privacy-disclaimer">
                    🔒 All chat data is stored locally on your device SQLite database.
                </div>
            </div>
        </main>
    </div>

    <!-- System Prompt Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>System Settings</h3>
            <label for="systemPrompt">System Prompt:</label>
            <textarea id="systemPromptInput" rows="4">You are a helpful, concise, private AI assistant running locally on edge hardware. Respond accurately and clearly.</textarea>
            
            <label for="temperatureInput">Temperature (0.0 = Precise, 1.0 = Creative):</label>
            <input type="range" id="temperatureInput" min="0" max="1" step="0.1" value="0.7">
            <span id="tempValue">0.7</span>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="closeSettingsBtn">Cancel</button>
                <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed', err));
        }
    </script>
</body>
</html>
